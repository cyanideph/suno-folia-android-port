name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          ANDROID_SDK_ROOT=$HOME/Library/Android/sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip cmdline-tools.zip
          rm cmdline-tools.zip
          # Find sdkmanager - the zip extracts to a versioned directory
          CMDL_DIR=$(ls)
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/$CMDL_DIR/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            echo "::error::sdkmanager not found at $SDKMGR"
            exit 1
          fi
          chmod +x "$SDKMGR"
          # Accept licenses
          yes "$SDKMGR" --licenses 2>&1 || true
          # Install platforms and build tools
          "$SDKMGR" "platforms;android-33" "build-tools;33.0.2" 2>&1

      - name: Sync Capacitor Android
        run: npx cap sync

      - name: Build Android APK
        run: npx cap build android

      - name: Assemble Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.useAndroidX=true -Dorg.gradle.jvmargs="-Xmx512m" --stacktrace 2>&1 | tail -50

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suno-folia-apk
          path: android/app/build/outputs/apk/release/*.apk