name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK Command-line Tools
        run: |
          ANDROID_SDK_ROOT=$HOME/Library/Android/sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          cd "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          curl -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip cmdline-tools.zip
          rm cmdline-tools.zip
          yes | cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" 2>&1

      - name: Setup ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_CMDLINE_TOOLS=$ANDROID_SDK_ROOT/cmdline-tools/latest" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/platform-tools/bin/sdkmanager --licenses

      - name: Sync Capacitor Android
        run: npx cap sync

      - name: Build Android APK
        run: npx cap build android

      - name: Assemble Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.useAndroidX=true -Dorg.gradle.jvmargs="-Xmx512m" --stacktrace 2>&1 | tail -50

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suno-folia-apk
          path: android/app/build/outputs/apk/release/*.apk